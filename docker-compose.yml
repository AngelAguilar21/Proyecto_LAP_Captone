# AeroTrack en contenedor.
#
#   Equipo sin GPU (o cualquier equipo):   docker compose up -d --build
#   Servidor con GPU NVIDIA:               docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build
#
# En ambos casos el sistema detecta solo si ve una GPU y elige su perfil: revisa con `docker compose logs`
# la línea que empieza con «Hardware:». Se abre en http://localhost:8765
#
# Variables (en un archivo .env junto a este, que no se versiona):
#   AEROTRACK_ADMIN_USER / AEROTRACK_ADMIN_PASSWORD  cuenta de operador inicial (mínimo 6 caracteres). Si no se
#                                                    definen, el primero en entrar crea la cuenta: no lo dejes así en un servidor público.
#   AEROTRACK_ALLOWED_HOSTS                          dominio(s) públicos separados por coma, p. ej. aerotrack.midominio.com
#   AEROTRACK_BIND                                   127.0.0.1 (por defecto) o 0.0.0.0 para recibir conexiones de fuera. Si lo abres,
#                                                    pon HTTPS delante (Caddy o Nginx) y no publiques el puerto 8765 directo a Internet.
#   AEROTRACK_VIDEOS                                 carpeta del servidor con tus videos (se ve en el contenedor como /videos)
name: aerotrack

services:
  aerotrack:
    build:
      context: .
    image: aerotrack:latest
    ports:
      - "${AEROTRACK_BIND:-127.0.0.1}:8765:8765"
    environment:
      AEROTRACK_ADMIN_USER: ${AEROTRACK_ADMIN_USER:-}
      AEROTRACK_ADMIN_PASSWORD: ${AEROTRACK_ADMIN_PASSWORD:-}
      AEROTRACK_ALLOWED_HOSTS: ${AEROTRACK_ALLOWED_HOSTS:-}
    volumes:
      - config:/app/proyecto_lap_prototipo/config
      - data:/app/proyecto_lap_prototipo/data
      - ${AEROTRACK_VIDEOS:-./videos}:/videos:ro
    restart: unless-stopped

volumes:
  config:
  data:
