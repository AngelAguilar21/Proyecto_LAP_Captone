<title>Consola de Rastreo LAP</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --bg-outer:#0a0704;
  --bezel:#171106;
  --bezel-hi:#3a2a10;
  --scope-bg:#0b0804;
  --amber:#f3a83c;
  --amber-dim:#8a6428;
  --amber-faint:#33260f;
  --teal:#6fcfc0;
  --teal-dim:#3d6b63;
  --teal-faint:#12312c;
  --fused:#f6ecd2;
  --hud:#d8c69a;
  --hud-dim:#7d6c49;
  --danger:#c65d3b;
  --font-mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  min-height:100vh;
  background:var(--bg-outer);
  color:var(--hud);
  font-family:var(--font-mono);
  display:flex;
  flex-direction:column;
  overflow-x:hidden;
}

.stage{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:clamp(10px,2vw,26px);
  min-height:0;
}

.bezel{
  position:relative;
  width:100%;
  max-width:1180px;
  aspect-ratio:1.72/1;
  max-height:82vh;
  background:linear-gradient(160deg,var(--bezel),#0f0b04 70%);
  border:1px solid var(--bezel-hi);
  border-radius:14px;
  padding:clamp(8px,1.4vw,16px);
  box-shadow:0 30px 70px -30px #000000cc, inset 0 0 0 1px #000;
}

.scope{
  position:relative;
  width:100%;
  height:100%;
  background:
    radial-gradient(ellipse at 50% 40%, #14100a 0%, var(--scope-bg) 72%);
  border-radius:6px;
  overflow:hidden;
  box-shadow:inset 0 0 60px #000000aa, inset 0 0 2px #000;
}

svg.plot{
  position:absolute; inset:0;
  width:100%; height:100%;
  display:block;
}

.scanline{
  position:absolute; inset:-10% -10%;
  background:linear-gradient(100deg,
    transparent 0%, transparent 46%,
    #f3a83c14 49%, #f3a83c22 50%, #f3a83c14 51%,
    transparent 54%, transparent 100%);
  animation:sweep 7s linear infinite;
  mix-blend-mode:screen;
  pointer-events:none;
}
@keyframes sweep{
  0%{ transform:translateX(-30%); }
  100%{ transform:translateX(30%); }
}
@media (prefers-reduced-motion:reduce){
  .scanline{ animation:none; opacity:.4; }
}

.vignette{
  position:absolute; inset:0;
  box-shadow:inset 0 0 90px 20px #000000cc;
  pointer-events:none;
}

.hud{
  position:absolute;
  font-family:var(--font-mono);
  color:var(--amber);
  text-shadow:0 0 6px #f3a83c55;
  pointer-events:none;
  line-height:1.25;
}
.hud .big{
  font-size:clamp(15px,2.1vw,24px);
  font-weight:700;
  font-variant-numeric:tabular-nums;
}
.hud .small{
  font-size:clamp(8.5px,1vw,10.5px);
  color:var(--hud-dim);
  text-shadow:none;
  letter-spacing:.06em;
}
.hud.tl{ top:clamp(8px,1.6vw,16px); left:clamp(10px,1.8vw,18px); }
.hud.tr{ top:clamp(8px,1.6vw,16px); right:clamp(10px,1.8vw,18px); text-align:right; }
.hud.bl{ bottom:clamp(8px,1.6vw,16px); left:clamp(10px,1.8vw,18px); }
.hud.br{ bottom:clamp(8px,1.6vw,16px); right:clamp(10px,1.8vw,18px); text-align:right; }

.key{ display:flex; gap:12px; justify-content:flex-end; flex-wrap:wrap; }
.key span{ display:inline-flex; align-items:center; gap:5px; }
.key i{ width:8px;height:8px;border-radius:50%;display:inline-block; }

.readout{
  position:absolute; left:clamp(10px,1.8vw,18px); right:clamp(10px,1.8vw,18px);
  bottom:clamp(34px,5vw,46px);
  font-size:clamp(10px,1.15vw,12.5px);
  color:var(--fused);
  text-shadow:0 0 5px #f6ecd255;
  letter-spacing:.02em;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  pointer-events:none;
}
.readout .dim{ color:var(--hud-dim); text-shadow:none; }

.tray{
  flex:none;
  display:flex;
  align-items:center;
  gap:clamp(8px,1.6vw,18px);
  padding:10px clamp(14px,3vw,32px);
  background:#0d0904;
  border-top:1px solid var(--bezel-hi);
  flex-wrap:wrap;
}
.dial-btn{
  font-family:var(--font-mono);
  font-weight:700;
  font-size:13px;
  background:transparent;
  color:var(--amber);
  border:1px solid var(--amber-dim);
  border-radius:3px;
  padding:6px 12px;
  cursor:pointer;
  letter-spacing:.04em;
}
.dial-btn:hover{ background:#f3a83c14; }
.dial-btn:focus-visible{ outline:2px solid var(--amber); outline-offset:2px; }

.scrub-wrap{ flex:1; min-width:140px; display:flex; align-items:center; gap:10px; }
input[type="range"]{
  flex:1; height:3px; appearance:none; background:var(--amber-faint);
  border-radius:2px; cursor:pointer;
}
input[type="range"]::-webkit-slider-thumb{
  appearance:none; width:11px; height:11px; border-radius:50%;
  background:var(--amber); box-shadow:0 0 8px #f3a83c99; cursor:pointer;
}
input[type="range"]::-moz-range-thumb{
  width:11px; height:11px; border-radius:50%; border:none;
  background:var(--amber); box-shadow:0 0 8px #f3a83c99; cursor:pointer;
}
.tclock{
  font-size:12px; color:var(--hud-dim); font-variant-numeric:tabular-nums;
  white-space:nowrap;
}

.speeds{ display:flex; gap:4px; }
.speed-btn{
  font-family:var(--font-mono); font-size:11px; font-weight:600;
  background:transparent; color:var(--hud-dim); border:1px solid var(--bezel-hi);
  border-radius:3px; padding:5px 8px; cursor:pointer;
}
.speed-btn.on{ color:var(--scope-bg); background:var(--amber); border-color:var(--amber); }
.speed-btn:focus-visible{ outline:2px solid var(--amber); outline-offset:2px; }

.person-dot{ cursor:pointer; }
.person-dot.selected{ stroke:#ffffff; stroke-width:.045; }
.tag-text{ font-family:var(--font-mono); pointer-events:none; }
</style>

<div class="stage">
  <div class="bezel">
    <div class="scope" id="scope">
      <svg class="plot" id="svgPlano" preserveAspectRatio="xMidYMid meet"></svg>
      <div class="scanline"></div>
      <div class="vignette"></div>

      <div class="hud tl">
        <div class="big" id="hudTime">T+00.0</div>
        <div class="small" id="hudTimeTotal">/ 00.0 s</div>
      </div>

      <div class="hud tr">
        <div class="big" id="hudActive">0</div>
        <div class="small">OBJETIVOS ACTIVOS</div>
      </div>

      <div class="hud bl">
        <div class="small" id="hudTotales">-- TRACKS · PICO --</div>
      </div>

      <div class="hud br">
        <div class="key">
          <span><i style="background:var(--amber)"></i>CAM A</span>
          <span><i style="background:var(--teal)"></i>CAM B</span>
          <span><i style="background:var(--fused)"></i>A+B</span>
        </div>
      </div>

      <div class="readout" id="readout">SIN OBJETIVO SELECCIONADO — TOCÁ UN PUNTO</div>
    </div>
  </div>
</div>

<div class="tray">
  <button class="dial-btn" id="btnPlay">▶</button>
  <button class="dial-btn" id="btnReset">↺</button>
  <div class="scrub-wrap">
    <input type="range" id="scrubber" min="0" max="1" value="0" step="1">
  </div>
  <span class="tclock" id="tClock">00.0 / 00.0 s</span>
  <div class="speeds" id="speeds">
    <button class="speed-btn" data-v="0.5">.5×</button>
    <button class="speed-btn on" data-v="1">1×</button>
    <button class="speed-btn" data-v="2">2×</button>
    <button class="speed-btn" data-v="4">4×</button>
  </div>
</div>

<script>
(function(){
  const datos = JSON.parse(document.getElementById('datos-json').textContent);
  const meta = datos.meta, personas = datos.personas, frames = datos.frames, alcances = datos.alcances || {};

  const svg = document.getElementById('svgPlano');
  const [x0,x1] = meta.rango_x, [y0,y1] = meta.rango_y;
  const w = x1-x0, h = y1-y0;
  svg.setAttribute('viewBox', `${x0} ${y0} ${w} ${h}`);
  const ns = 'http://www.w3.org/2000/svg';
  function el(tag,attrs){ const e=document.createElementNS(ns,tag); for(const k in attrs) e.setAttribute(k,attrs[k]); return e; }

  // grilla
  const gGrid = el('g',{});
  for(let gx=Math.ceil(x0); gx<x1; gx++){
    gGrid.appendChild(el('line',{x1:gx,y1:y0,x2:gx,y2:y1,stroke:'#f3a83c',opacity:0.06,'stroke-width':w*0.0022}));
  }
  for(let gy=Math.ceil(y0); gy<y1; gy++){
    gGrid.appendChild(el('line',{x1:x0,y1:gy,x2:x1,y2:gy,stroke:'#f3a83c',opacity:0.06,'stroke-width':w*0.0022}));
  }
  svg.appendChild(gGrid);

  // alcances de camara (proyectados al plano)
  const FUENTE_SVG = "'JetBrains Mono',ui-monospace,monospace";
  const COLOR_CAM_HEX = {A:'#f3a83c', B:'#6fcfc0'};
  Object.entries(alcances).forEach(([cam, pts])=>{
    if(!pts || !pts.length) return;
    const puntos = pts.map(p=>p.join(',')).join(' ');
    svg.appendChild(el('polygon',{points:puntos, fill:COLOR_CAM_HEX[cam]||'#888', 'fill-opacity':0.05,
      stroke:COLOR_CAM_HEX[cam]||'#888', 'stroke-width':w*0.0028, 'stroke-dasharray':`${w*0.012},${w*0.009}`}));
    const topY = Math.min(...pts.map(p=>p[1]));
    const cx = pts.reduce((s,p)=>s+p[0],0)/pts.length;
    const t = el('text',{x:cx, y:topY - h*0.02, fill:COLOR_CAM_HEX[cam]||'#888', 'font-size':h*0.036,
      'font-family':FUENTE_SVG, 'text-anchor':'middle', 'font-weight':'700', 'letter-spacing':'.05em'});
    t.textContent = `ALCANCE ${cam}`;
    t.setAttribute('class','tag-text');
    svg.appendChild(t);
  });

  const gPersonas = el('g',{});
  svg.appendChild(gPersonas);

  const radio = w*0.024;
  let indice=0, reproduciendo=false, ultimoTs=null, acumulado=0, seleccionado=null, velocidad=1;

  function colorDe(cams){
    const a = cams.includes('A'), b = cams.includes('B');
    if(a&&b) return '#f6ecd2';
    if(a) return '#f3a83c';
    return '#6fcfc0';
  }

  function fmt(t){ return t.toFixed(1).padStart(4,'0'); }

  function renderReadout(id){
    const ro = document.getElementById('readout');
    if(!id || !personas[id]){ ro.innerHTML = 'SIN OBJETIVO SELECCIONADO — TOCÁ UN PUNTO'; return; }
    const p = personas[id];
    ro.innerHTML = `TRACK <b>${id}</b> <span class="dim">·</span> T+${p.primero.toFixed(1)}–${p.ultimo.toFixed(1)}s (${p.duracion.toFixed(1)}s) `+
      `<span class="dim">·</span> SRC ${p.camaras.join('+')} <span class="dim">·</span> ${p.detecciones} PTS`;
  }

  function renderFrame(i){
    indice = i;
    const frame = frames[i];
    gPersonas.innerHTML='';
    frame.forEach(([id,x,y,cams])=>{
      const color = colorDe(cams);
      const leaderX = x + radio*2.1, leaderY = y - radio*2.1;
      const linea = el('line',{x1:x,y1:y,x2:leaderX,y2:leaderY,stroke:color,'stroke-width':w*0.0016,opacity:.55});
      gPersonas.appendChild(linea);
      const dot = el('circle',{cx:x,cy:y,r:radio,fill:color,class:'person-dot'+(id===seleccionado?' selected':'')});
      dot.addEventListener('click',()=>{ seleccionado=id; renderReadout(id); renderFrame(indice); });
      gPersonas.appendChild(dot);
      const tag = el('text',{x:leaderX+radio*0.4,y:leaderY,fill:color,'font-size':w*0.017,
        'font-family':FUENTE_SVG,'font-weight':'700'});
      tag.textContent = `${id.slice(0,4).toUpperCase()}·${cams.join('')}`;
      tag.setAttribute('class','tag-text');
      gPersonas.appendChild(tag);
    });
    document.getElementById('hudActive').textContent = frame.length;
    const t = i*meta.paso;
    document.getElementById('hudTime').textContent = 'T+'+fmt(t);
    document.getElementById('tClock').textContent = `${fmt(t)} / ${fmt(meta.duracion_total)} s`;
    document.getElementById('scrubber').value = i;
  }

  function tick(ts){
    if(!reproduciendo) return;
    if(ultimoTs===null) ultimoTs=ts;
    const dt=(ts-ultimoTs)/1000; ultimoTs=ts;
    acumulado += dt*velocidad;
    if(acumulado>=meta.paso){
      acumulado=0;
      let sig = indice+1;
      if(sig>=frames.length) sig=0;
      renderFrame(sig);
    }
    requestAnimationFrame(tick);
  }

  const btnPlay=document.getElementById('btnPlay');
  btnPlay.addEventListener('click',()=>{
    reproduciendo=!reproduciendo; ultimoTs=null;
    btnPlay.textContent = reproduciendo?'⏸':'▶';
    if(reproduciendo) requestAnimationFrame(tick);
  });
  document.getElementById('btnReset').addEventListener('click',()=>{
    reproduciendo=false; btnPlay.textContent='▶'; renderFrame(0);
  });
  document.getElementById('scrubber').addEventListener('input',(e)=>{
    reproduciendo=false; btnPlay.textContent='▶'; renderFrame(parseInt(e.target.value,10));
  });
  document.querySelectorAll('.speed-btn').forEach(b=>{
    b.addEventListener('click',()=>{
      document.querySelectorAll('.speed-btn').forEach(x=>x.classList.remove('on'));
      b.classList.add('on');
      velocidad = parseFloat(b.dataset.v);
    });
  });

  document.getElementById('scrubber').max = frames.length-1;
  document.getElementById('hudTimeTotal').textContent = '/ '+meta.duracion_total.toFixed(1)+' s';
  document.getElementById('hudTotales').textContent = `${meta.total_ids} TRACKS · PICO ${meta.pico_concurrentes}`;

  let idLargo=null, mejor=-1;
  Object.entries(personas).forEach(([id,p])=>{ if(p.duracion>mejor){mejor=p.duracion; idLargo=id;} });
  seleccionado=idLargo;
  renderReadout(idLargo);
  let frameInicial = frames.findIndex(f=>f.some(p=>p[0]===idLargo));
  renderFrame(frameInicial>=0?frameInicial:0);

  reproduciendo=true; btnPlay.textContent='⏸';
  requestAnimationFrame(tick);
})();
</script>
